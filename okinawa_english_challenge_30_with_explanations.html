<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>沖縄で学ぶ！英語ミッション 難関30問</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:"Yu Gothic","Meiryo",sans-serif;background:linear-gradient(#86dff0 0 23%,#effcff 23% 100%);color:#19384b}
header{background:linear-gradient(90deg,#075f7e,#0ba7b8);color:#fff;padding:18px;text-align:center;border-bottom:7px solid #ffd35f}
header h1{margin:0;font-size:clamp(25px,4vw,42px)} header p{margin:7px 0 0;font-weight:bold}
.wrap{max-width:1080px;margin:auto;padding:18px;display:grid;grid-template-columns:220px 1fr;gap:18px}
.side,.card{background:white;border-radius:24px;box-shadow:0 8px 22px #0b5e7730;border:3px solid #75d2df}
.side{padding:15px;height:max-content} .side h3{text-align:center;color:#075f7e;margin:2px 0 10px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px} .num{border:0;border-radius:50%;aspect-ratio:1;background:#e7f9fb;font-weight:bold;cursor:pointer}
.num.current{background:#ffd35f} .num.ok{background:#b9efc4} .num.ng{background:#ffc6c6}
.card{padding:25px;position:relative;overflow:hidden} .card:before{content:"🌺";position:absolute;right:18px;top:10px;font-size:43px}
.badge{display:inline-block;background:#7f4fb3;color:#fff;border-radius:999px;padding:7px 15px;font-weight:bold}
h2{font-size:clamp(20px,3vw,29px);padding-right:50px;line-height:1.5} .choices{display:grid;gap:11px;margin:18px 0}
.choice{text-align:left;padding:13px 16px;border:2px solid #80d5df;border-radius:15px;background:white;font-size:17px;cursor:pointer}
.choice:hover{background:#effcfd} .choice.selected{outline:4px solid #ffd35f} .choice.correct{background:#dff7e4;border-color:#38a35b} .choice.wrong{background:#ffe3e3;border-color:#db5b5b}
.words{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0} .word{padding:10px 13px;border:2px solid #62cbd8;background:#fff;border-radius:12px;cursor:pointer}
.answerbox{min-height:48px;padding:11px;border:2px dashed #0aa0b1;border-radius:13px;background:#f2fdff;margin:10px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap} button.main{border:0;border-radius:14px;padding:12px 20px;font-weight:bold;font-size:16px;cursor:pointer;background:#075f7e;color:white}
button.next{background:#e36f53} .feedback{display:none;margin-top:18px;padding:15px;border-radius:16px;background:#fff7d7;border-left:7px solid #ffd04d;line-height:1.75}
.feedback strong{font-size:18px} .score{margin-top:15px;text-align:center;font-weight:bold} .island{text-align:center;font-size:25px;margin-top:10px}
footer{text-align:center;padding:16px;color:#075f7e;font-weight:bold}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.side{order:2}}
</style>
</head>
<body>
<header><h1>🌺 沖縄で学ぶ！英語ミッション 🏝️</h1><p>👑 難関レベル 30問｜義務・不要・禁止を文脈から見抜こう！</p></header>
<div class="wrap">
<aside class="side"><h3>FINAL MISSION</h3><div id="nums" class="nums"></div><div class="score" id="score">正解 0 / 30</div><div class="island">🌴🌺🦁🌊👑</div></aside>
<main class="card"><span class="badge" id="badge">QUESTION 1</span><h2 id="q"></h2><div id="area"></div>
<div class="actions"><button class="main" id="check">答え合わせ</button><button class="main next" id="next">次の問題 →</button><button class="main" id="retry" style="display:none">もう一度挑戦</button></div>
<div class="feedback" id="fb"></div></main>
</div><footer>🌊 Nankuru nai sa! でも問題はじっくり考えよう 🌺</footer>
<script>
const Q=[{"type": "choice", "q": "A: The library closes at six. B: Then we (　) leave before six. 最も適切なのは？", "opts": ["have to", "must not", "don't have to", "doesn't have to"], "ans": 0, "exp": "閉館が6時なので、それより前に出る必要があります。主語 we なので have to。must でも意味は近いですが、選択肢では have to が最適です。"}, {"type": "choice", "q": "「You don't have to join the club.」と意味が最も近いものは？", "opts": ["It is not necessary for you to join the club.", "You must not join the club.", "Don't join the club.", "You have to join the club."], "ans": 0, "exp": "don't have to は「～する必要はない」。禁止ではなく、しなくてもよいという意味です。"}, {"type": "choice", "q": "「You mustn't use this door.」と意味が最も近いものは？", "opts": ["You are not allowed to use this door.", "It is not necessary to use this door.", "You have to use this door.", "You may use this door."], "ans": 0, "exp": "mustn't は「～してはいけない」という禁止。be not allowed to ～ と意味が近いです。"}, {"type": "choice", "q": "Which sentence is grammatically correct?", "opts": ["He doesn't have to come today.", "He doesn't has to come today.", "He musts come today.", "He must to come today."], "ans": 0, "exp": "doesn't の後は動詞の原形なので have。must は主語で変化せず、後ろに to も付けません。"}, {"type": "choice", "q": "A: Is homework required tonight? B: No. Which is best?", "opts": ["We don't have to do homework tonight.", "We mustn't do homework tonight.", "We must do homework tonight.", "Don't do homework tonight."], "ans": 0, "exp": "required ではない＝「する必要がない」。禁止ではないので don't have to が正解です。"}, {"type": "choice", "q": "A: This area is dangerous. B: So children (　) enter it. 最も自然なのは？", "opts": ["must not", "don't have to", "has to", "have to"], "ans": 0, "exp": "危険区域なので「入ってはいけない」という禁止。must not が最も自然です。"}, {"type": "choice", "q": "「Miki has to help her mother.」を must を使って正しく書き換えたものは？", "opts": ["Miki must help her mother.", "Miki musts help her mother.", "Miki must to help her mother.", "Miki doesn't must help her mother."], "ans": 0, "exp": "has to と must は肯定文でほぼ同じ意味。must は助動詞なので must + 動詞原形 help です。"}, {"type": "choice", "q": "「Don't be late.」を書き換えた文として最も適切なのは？", "opts": ["You must not be late.", "You don't have to be late.", "You have to be late.", "You must be late."], "ans": 0, "exp": "Don't + 動詞原形 は禁止命令。You must not + 動詞原形 に書き換えられます。"}, {"type": "choice", "q": "Which sentence means “She is free to come or not”?", "opts": ["She doesn't have to come.", "She mustn't come.", "She has to come.", "She must come."], "ans": 0, "exp": "「来ても来なくてもよい」に最も近いのは「来る必要はない」＝ doesn't have to come です。"}, {"type": "choice", "q": "Which sentence means “She is prohibited from coming”?", "opts": ["She must not come.", "She doesn't have to come.", "She has to come.", "She can come."], "ans": 0, "exp": "prohibited は禁止。must not come が正解です。don't have to は任意です。"}, {"type": "order", "q": "「私たちはこの部屋では静かにしなければなりません。」になるように並べ替えよう。", "words": ["We", "quiet", "have to", "be", "in this room"], "answer": "We have to be quiet in this room.", "exp": "have to の後ろは動詞の原形。be quiet で「静かにする／静かでいる」です。"}, {"type": "order", "q": "「彼女は明日早く来る必要はありません。」になるように並べ替えよう。", "words": ["She", "come", "doesn't have to", "early", "tomorrow"], "answer": "She doesn't have to come early tomorrow.", "exp": "主語 She の不要表現は doesn't have to + 動詞原形。doesn't の後ろは have のままです。"}, {"type": "order", "q": "「ここでそのボタンを押してはいけません。」になるように並べ替えよう。", "words": ["You", "press", "must not", "that button", "here"], "answer": "You must not press that button here.", "exp": "禁止は must not + 動詞原形。press が原形で続きます。"}, {"type": "choice", "q": "次の2文の関係として正しいものは？ ① You must not talk. ② You don't have to talk.", "opts": ["意味は異なる。①は禁止、②は必要がない。", "ほぼ同じ意味。", "①は必要がない、②は禁止。", "どちらも義務を表す。"], "ans": 0, "exp": "must not は禁止、don't have to は不要。日本語では混同しやすい重要ポイントです。"}, {"type": "choice", "q": "次の2文の関係として最も適切なのは？ ① Ken must study tonight. ② Ken has to study tonight.", "opts": ["ほぼ同じ意味を表す。", "①は禁止、②は義務。", "①は不要、②は禁止。", "意味は正反対。"], "ans": 0, "exp": "肯定文では must と have/has to はどちらも義務を表し、ほぼ同じ意味になります。"}, {"type": "choice", "q": "Which is the best correction? “She doesn't has to wash the dishes.”", "opts": ["She doesn't have to wash the dishes.", "She don't have to wash the dishes.", "She mustn't to wash the dishes.", "She doesn't have wash the dishes."], "ans": 0, "exp": "doesn't の後は動詞の原形。has ではなく have が正解です。"}, {"type": "choice", "q": "Which is the best correction? “He musts finish it today.”", "opts": ["He must finish it today.", "He has must finish it today.", "He must to finish it today.", "He mustn't finishes it today."], "ans": 0, "exp": "must は三人称単数でも変化しません。must + 動詞原形 finish です。"}, {"type": "choice", "q": "A teacher says, “This project is optional.” Which sentence matches?", "opts": ["You don't have to do this project.", "You must not do this project.", "You have to do this project.", "You must do this project."], "ans": 0, "exp": "optional は「任意の」。つまり「やる必要はない」ので don't have to が合います。"}, {"type": "choice", "q": "A sign says, “Staff Only.” Which is the best sentence for students?", "opts": ["Students must not enter.", "Students don't have to enter.", "Students have to enter.", "Students must enter."], "ans": 0, "exp": "Staff Only は生徒の立ち入り禁止を意味するので must not enter が適切です。"}, {"type": "choice", "q": "「You must not feed the animals.」の意味として最も適切なのは？", "opts": ["動物にえさを与えてはいけません。", "動物にえさを与える必要はありません。", "動物にえさを与えなければなりません。", "動物にえさを与えてもよいです。"], "ans": 0, "exp": "must not は強い禁止。「必要がない」ではありません。"}, {"type": "choice", "q": "「You don't have to feed the animals.」の意味として最も適切なのは？", "opts": ["動物にえさを与える必要はありません。", "動物にえさを与えてはいけません。", "動物にえさを与えなければなりません。", "動物にえさを与えることは不可能です。"], "ans": 0, "exp": "don't have to は「必要がない」。禁止ではないので、状況によっては与えてもよい可能性があります。"}, {"type": "choice", "q": "Which sentence best matches this situation? “The train leaves at 7:00, and it is 6:50 now.”", "opts": ["We have to hurry.", "We don't have to hurry.", "We must not hurry.", "He has to hurry."], "ans": 0, "exp": "列車の出発まで時間がないので「急がなければならない」。主語 we なので have to hurry が自然です。"}, {"type": "choice", "q": "Which sentence best matches this situation? “The meeting was canceled.”", "opts": ["We don't have to go to the office for the meeting.", "We must not go to the office.", "We have to go to the office.", "We must go to the office."], "ans": 0, "exp": "会議が中止されたので「会議のために行く必要がない」。禁止ではありません。"}, {"type": "choice", "q": "Which sentence is NOT possible as a rewrite of “Don't touch the painting.”?", "opts": ["You don't have to touch the painting.", "You must not touch the painting.", "You mustn't touch the painting.", "Do not touch the painting."], "ans": 0, "exp": "Don't touch... は禁止。must not / mustn't / Do not は同じ方向の意味ですが、don't have to は「触る必要がない」で禁止ではありません。"}, {"type": "choice", "q": "Which sentence is NOT possible as a rewrite of “Aya has to practice today.”?", "opts": ["Aya must practice today.", "Aya must to practice today.", "Aya needs to practice today.", "Aya is required to practice today."], "ans": 1, "exp": "must の後ろに to は不要です。Aya must practice today. が正しい形です。"}, {"type": "choice", "q": "A: Must I bring a dictionary? B: No, you (　). 最も適切なのは？", "opts": ["don't have to", "must not", "has to", "must"], "ans": 0, "exp": "「持ってくる必要がありますか？」に No なら、意味としては「持ってくる必要はない」。don't have to が適切です。"}, {"type": "choice", "q": "A: Can I take pictures here? B: No, you (　). 最も適切なのは？", "opts": ["must not", "don't have to", "have to", "has to"], "ans": 0, "exp": "写真を撮ってよいかに対して No なので禁止。must not が自然です。"}, {"type": "choice", "q": "Which sentence contains a grammatical error?", "opts": ["We must be careful.", "He has to be careful.", "She doesn't have to be careful.", "He musts be careful."], "ans": 3, "exp": "must は he でも must のまま。musts は誤りです。"}, {"type": "choice", "q": "Which sentence contains a grammatical error?", "opts": ["I have to leave now.", "She has to leave now.", "They don't have to leave now.", "She doesn't has to leave now."], "ans": 3, "exp": "doesn't の後は原形 have。doesn't has to は誤りです。"}, {"type": "choice", "q": "【総合】「宿題は提出しなくてもよいが、名前を書かずに出してはいけない。」に最も近い組み合わせは？", "opts": ["You don't have to hand in the homework, but you must not hand it in without your name.", "You must not hand in the homework, but you don't have to write your name.", "You have to hand in the homework, and you must not write your name.", "Don't hand in the homework, and you have to write your name."], "ans": 0, "exp": "前半は「提出する必要はない」＝ don't have to。後半は「名前なしで提出してはいけない」＝ must not。2つの意味の違いを同時に見抜く総合問題です。"}];
let idx=0,states=Array(Q.length).fill(null),selected=null,order=[];
const qel=document.getElementById('q'),area=document.getElementById('area'),fb=document.getElementById('fb');
function shuffledOpts(q){return q.opts.map((v,i)=>({v,i})).sort(()=>Math.random()-.5)}
let optionOrders=Q.map(q=>q.type==='choice'?shuffledOpts(q):null);
function renderNums(){const n=document.getElementById('nums');n.innerHTML='';Q.forEach((_,i)=>{const b=document.createElement('button');b.className='num '+(i===idx?'current ':'')+(states[i]===true?'ok':states[i]===false?'ng':'');b.textContent=i+1;b.onclick=()=>{idx=i;render()};n.appendChild(b)});document.getElementById('score').textContent='正解 '+states.filter(x=>x===true).length+' / 30';}
function render(){selected=null;order=[];fb.style.display='none';document.getElementById('badge').textContent='QUESTION '+(idx+1);qel.textContent=Q[idx].q;area.innerHTML='';const q=Q[idx];
if(q.type==='choice'){const d=document.createElement('div');d.className='choices';optionOrders[idx].forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o.v;b.dataset.i=o.i;b.onclick=()=>{if(fb.style.display==='block')return;selected=o.i;[...d.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};d.appendChild(b)});area.appendChild(d)}
else{const ans=document.createElement('div');ans.className='answerbox';ans.textContent='単語をタップして英文を作ろう';area.appendChild(ans);const w=document.createElement('div');w.className='words';q.words.slice().sort(()=>Math.random()-.5).forEach(x=>{const b=document.createElement('button');b.className='word';b.textContent=x;b.onclick=()=>{if(fb.style.display==='block')return;order.push(x);b.disabled=true;ans.textContent=order.join(' ')};w.appendChild(b)});area.appendChild(w);const reset=document.createElement('button');reset.className='word';reset.textContent='↺ 並べ直す';reset.onclick=()=>render();area.appendChild(reset)}renderNums();}
document.getElementById('check').onclick=()=>{const q=Q[idx];let ok=false,correct='';
if(q.type==='choice'){if(selected===null){alert('答えを選んでください。');return}ok=selected===q.ans;correct=q.opts[q.ans];[...area.querySelectorAll('.choice')].forEach(b=>{if(+b.dataset.i===q.ans)b.classList.add('correct');if(+b.dataset.i===selected&&selected!==q.ans)b.classList.add('wrong')})}
else{if(!order.length){alert('単語を並べてください。');return}let made=order.join(' ')+(order.join(' ').endsWith('.')?'':'.');ok=made.toLowerCase()===q.answer.toLowerCase();correct=q.answer;}
states[idx]=ok;fb.innerHTML='<strong>'+(ok?'⭕ 正解！':'❌ おしい！')+'</strong><br><b>正解：</b>'+correct+'<hr><b>💡 この問題の解説</b><br>'+q.exp;fb.style.display='block';renderNums();if(states.every(x=>x!==null))document.getElementById('retry').style.display='inline-block';};
document.getElementById('next').onclick=()=>{idx=(idx+1)%Q.length;render()};
document.getElementById('retry').onclick=()=>{states=Array(Q.length).fill(null);optionOrders=Q.map(q=>q.type==='choice'?shuffledOpts(q):null);idx=0;render();document.getElementById('retry').style.display='none'};
render();
</script></body></html>
