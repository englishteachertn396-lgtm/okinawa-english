<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>沖縄で学ぶ！have to / must 基礎30問</title>
<style>
:root{
  --sea:#13a8d8; --deep:#0578b8; --sky:#dff7ff; --sand:#fff3cf;
  --coral:#ff6f8d; --hibiscus:#ef476f; --leaf:#2a9d6f; --ink:#17324d;
  --card:#ffffffee; --ok:#208a5d; --ng:#d6455d;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;color:var(--ink);
background:linear-gradient(#bceeff 0 28%,#63d6ed 28% 40%,#0bb4d1 40% 52%,#fff0bd 52% 100%);min-height:100vh;}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(circle at 15% 10%,#fff 0 2px,transparent 3px),radial-gradient(circle at 75% 17%,#fff 0 2px,transparent 3px);background-size:80px 80px,110px 110px}
.wrap{max-width:1180px;margin:auto;padding:18px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 26px;background:linear-gradient(135deg,#ffffffef,#e7fbffef);box-shadow:0 12px 30px #086b8b33;border:3px solid #fff}
.hero h1{margin:0;font-size:clamp(28px,4vw,50px);color:#075f9f;text-shadow:0 2px #fff}
.hero p{margin:6px 0 0;font-weight:800;font-size:18px}
.hero .decor{position:absolute;right:18px;top:4px;font-size:74px;filter:drop-shadow(0 4px 2px #0002)}
.hero .sub{display:inline-block;margin-top:10px;padding:7px 14px;border-radius:999px;background:#fff2f5;color:#c7355b;font-weight:900}
.grid{display:grid;grid-template-columns:270px 1fr;gap:18px;margin-top:18px}
.side,.main{background:var(--card);border-radius:24px;box-shadow:0 10px 24px #075f7d2c;border:2px solid #ffffff;padding:18px}
.side h2{font-size:19px;margin:0 0 12px;color:#a82e50}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.num{border:0;border-radius:12px;padding:10px 0;background:#e8fbfb;color:#17324d;font-weight:900;cursor:pointer;border:1px solid #9fdad7}
.num.current{background:#087dcc;color:white}.num.done{background:#dff7ea;border-color:#73c69e}.num.wrong{background:#ffe5ea;border-color:#f29aae}
.legend{margin-top:16px;padding:14px;border-radius:18px;background:#fff7df;font-size:14px;line-height:1.7}
.shisa{font-size:52px;text-align:center;margin-top:12px}.cheer{text-align:center;font-weight:900;color:#0c68ae}
.progress{height:13px;background:#d9eef4;border-radius:999px;overflow:hidden;margin-bottom:14px}.progress>div{height:100%;background:linear-gradient(90deg,#15a6d5,#41c68b);width:0%;transition:.3s}
.qmeta{font-weight:900;color:#0d6fa9}.instruction{font-size:17px;font-weight:800;margin:12px 0;color:#61433a}
.question{font-size:clamp(22px,3vw,34px);font-weight:900;margin:18px 0 16px;line-height:1.45;background:#f7fdff;border-left:7px solid #12a5d0;padding:18px;border-radius:12px}
.jp{font-size:16px;font-weight:700;color:#5c6370;margin-top:-8px;margin-bottom:14px}
.options{display:grid;gap:12px}.opt{width:100%;text-align:left;border:2px solid #c8dce8;background:white;border-radius:16px;padding:15px 18px;font-size:19px;font-weight:800;color:#1b3550;cursor:pointer;transition:.16s}
.opt:hover{transform:translateY(-1px);border-color:#6abfd9}.opt.selected{border-color:#0b84bd;background:#e7f7ff}.opt.correct{border-color:#41a77c;background:#e5f8ee}.opt.incorrect{border-color:#db5b70;background:#ffe9ee}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:999px;padding:13px 22px;font-size:17px;font-weight:900;cursor:pointer}.check{background:linear-gradient(90deg,#079be0,#0974be);color:#fff}.next{background:linear-gradient(90deg,#ff7891,#f34f7a);color:#fff}.reset{background:#eef3f6;color:#42556a}.btn:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:18px;background:#fff7e8;border:2px solid #f4d594;line-height:1.75}.feedback.show{display:block}.feedback .big{font-size:22px;font-weight:900}.feedback.ok .big{color:var(--ok)}.feedback.ng .big{color:var(--ng)}
.result{display:none;text-align:center;padding:28px}.result.show{display:block}.result .score{font-size:56px;font-weight:1000;color:#087cba}.badge{display:inline-block;padding:8px 15px;border-radius:999px;background:#ffe3ec;color:#c13660;font-weight:900;margin:8px}
.footer{text-align:center;margin:18px auto 0;color:#5f4122;font-weight:900;background:#fff3cdcc;border-radius:18px;padding:12px}
.small{font-size:13px;color:#637081}
@media(max-width:800px){.grid{grid-template-columns:1fr}.side{order:2}.hero .decor{font-size:48px;opacity:.65}.nums{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="decor">🌺🌴🦁</div>
    <h1>沖縄で学ぶ！ 英語ミッション</h1>
    <p>have to / has to / must / must not 基礎30問</p>
    <span class="sub">🌱 基礎レベル　〜青い海をめざして30問クリア！〜</span>
  </section>

  <div class="grid">
    <aside class="side">
      <h2>🌺 問題を選ぼう！</h2>
      <div id="nums" class="nums"></div>
      <div class="legend">✅ 正解した問題は緑色<br>❌ 間違えた問題は赤色<br>💡 解説を読んで次へ進もう！</div>
      <div class="shisa">🦁🌺</div>
      <div class="cheer">最後までがんばろう！</div>
    </aside>

    <main class="main">
      <div id="quizView">
        <div class="progress"><div id="bar"></div></div>
        <div id="meta" class="qmeta"></div>
        <div id="instruction" class="instruction"></div>
        <div id="question" class="question"></div>
        <div id="jp" class="jp"></div>
        <div id="options" class="options"></div>
        <div class="actions">
          <button id="checkBtn" class="btn check">🌊 答え合わせ</button>
          <button id="nextBtn" class="btn next" disabled>次の問題へ ➜</button>
          <button id="resetBtn" class="btn reset">選び直す</button>
        </div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
      </div>
      <div id="result" class="result">
        <div style="font-size:58px">🏝️🌺🦁</div>
        <h2>30問クリア！</h2>
        <div id="score" class="score"></div>
        <div id="message"></div>
        <button id="retry" class="btn check" style="margin-top:18px">もう一度チャレンジ</button>
      </div>
    </main>
  </div>
  <div class="footer">🌴 コツコツが未来の自分をつくる！　Good vibes, good English! 🌺</div>
</div>

<script>
const Q = [
{inst:'（　）に入る正しい語を選びましょう。',q:'I (　) get up early today.',jp:'私は今日、早く起きなければなりません。',o:['have to','has to','don’t have to','must not'],a:'have to',e:'主語が I なので「～しなければならない」は have to を使います。'},
{inst:'（　）に入る正しい語を選びましょう。',q:'She (　) clean her room today.',jp:'彼女は今日、部屋を掃除しなければなりません。',o:['have to','has to','must not','don’t have to'],a:'has to',e:'主語が She（三人称単数）なので has to になります。'},
{inst:'正しい英文を選びましょう。',q:'「私たちは宿題をしなければなりません。」',jp:'',o:['We have to do our homework.','We has to do our homework.','We don’t have to do our homework.','We must not do our homework.'],a:'We have to do our homework.',e:'主語 We には have to を使います。'},
{inst:'（　）に入る正しい語を選びましょう。',q:'Ken (　) practice tennis after school.',jp:'健は放課後テニスを練習しなければなりません。',o:['has to','have to','don’t have to','must not'],a:'has to',e:'Ken は一人の人なので三人称単数。has to が正解です。'},
{inst:'意味が合うものを選びましょう。',q:'You must study English.',jp:'',o:['あなたは英語を勉強しなければなりません。','あなたは英語を勉強する必要はありません。','あなたは英語を勉強してはいけません。','英語を勉強しなさい。という意味ではない。'],a:'あなたは英語を勉強しなければなりません。',e:'must は「～しなければならない」という強い必要・義務を表します。'},
{inst:'（　）に入る正しい語を選びましょう。',q:'I (　) go to school tomorrow. It is Sunday.',jp:'私は明日、学校へ行く必要はありません。日曜日です。',o:['don’t have to','doesn’t have to','must','has to'],a:'don’t have to',e:'I + 「～する必要はない」なので don’t have to です。'},
{inst:'（　）に入る正しい語を選びましょう。',q:'He (　) cook dinner today.',jp:'彼は今日、夕食を作る必要はありません。',o:['doesn’t have to','don’t have to','must not','have to'],a:'doesn’t have to',e:'He は三人称単数なので doesn’t have to を使います。'},
{inst:'意味が合うものを選びましょう。',q:'You don’t have to run.',jp:'',o:['走る必要はありません。','走ってはいけません。','走らなければなりません。','走りなさい。'],a:'走る必要はありません。',e:'don’t have to は「～する必要はない」。禁止ではありません。'},
{inst:'意味が合うものを選びましょう。',q:'You must not run here.',jp:'',o:['ここで走ってはいけません。','ここで走る必要はありません。','ここで走らなければなりません。','ここで走ることができます。'],a:'ここで走ってはいけません。',e:'must not / mustn’t は「～してはいけない」という禁止です。'},
{inst:'同じ意味になる文を選びましょう。',q:'You must not swim here.',jp:'ここで泳いではいけません。',o:["Don’t swim here.",'You don’t have to swim here.','You have to swim here.','Please swim here.'],a:"Don’t swim here.",e:'You must not ～. は Don’t ～. とほぼ同じ「～してはいけない」という禁止を表します。'},
{inst:'（　）に入る正しい語を選びましょう。',q:'My sister (　) help my mother.',jp:'私の姉は母を手伝わなければなりません。',o:['has to','have to','don’t have to','mustn’t'],a:'has to',e:'My sister は三人称単数なので has to です。'},
{inst:'（　）に入る正しい語を選びましょう。',q:'They (　) wear school uniforms.',jp:'彼らは学校の制服を着なければなりません。',o:['have to','has to','doesn’t have to','must not'],a:'have to',e:'They には have to を使います。'},
{inst:'意味が合うものを選びましょう。',q:'Aya doesn’t have to get up early.',jp:'',o:['アヤは早く起きる必要はありません。','アヤは早く起きてはいけません。','アヤは早く起きなければなりません。','アヤは早く起きたいです。'],a:'アヤは早く起きる必要はありません。',e:'doesn’t have to は「～する必要はない」です。'},
{inst:'同じ意味になる文を選びましょう。',q:'We have to study math.',jp:'私たちは数学を勉強しなければなりません。',o:['We must study math.','We must not study math.','We don’t have to study math.','Don’t study math.'],a:'We must study math.',e:'have to と must は、基礎段階ではどちらも「～しなければならない」と考えられます。'},
{inst:'同じ意味になる文を選びましょう。',q:'He has to go home now.',jp:'彼は今、家に帰らなければなりません。',o:['He must go home now.','He must not go home now.','He doesn’t have to go home now.','Don’t go home now.'],a:'He must go home now.',e:'has to は主語が三人称単数のときの形。must に書き換えると must は主語で形が変わりません。'},
{inst:'正しい文を選びましょう。',q:'「あなたはここで写真を撮ってはいけません。」',jp:'',o:['You must not take pictures here.','You don’t have to take pictures here.','You have to take pictures here.','You has to take pictures here.'],a:'You must not take pictures here.',e:'「～してはいけない」は must not / mustn’t を使います。'},
{inst:'正しい文を選びましょう。',q:'「ここで食べてはいけません。」',jp:'',o:["Don’t eat here.",'Don’t to eat here.','Not eat here.','Doesn’t eat here.'],a:"Don’t eat here.",e:'禁止の命令文は Don’t + 動詞の原形 です。'},
{inst:'（　）に入る正しい語を選びましょう。',q:'You (　) use your phone in class.',jp:'授業中、携帯電話を使ってはいけません。',o:['must not','don’t have to','have to','has to'],a:'must not',e:'禁止なので must not が正解です。don’t have to は「必要がない」です。'},
{inst:'（　）に入る正しい語を選びましょう。',q:'Tom (　) wash the dishes today. His father will do it.',jp:'トムは今日、皿を洗う必要はありません。父がします。',o:['doesn’t have to','must not','has to','don’t have to'],a:'doesn’t have to',e:'Tom は三人称単数で、「必要はない」なので doesn’t have to です。'},
{inst:'正しい文を選びましょう。',q:'「私は今日、勉強しなければなりません。」',jp:'',o:['I must study today.','I must not study today.','I doesn’t have to study today.','I has to study today.'],a:'I must study today.',e:'must + 動詞の原形で「～しなければならない」です。'},
{inst:'間違っている文を1つ選びましょう。',q:'次のうち、文法的に間違っているものは？',jp:'',o:['She have to study today.','She has to study today.','She must study today.','She doesn’t have to study today.'],a:'She have to study today.',e:'She には have to ではなく has to を使います。'},
{inst:'間違っている文を1つ選びましょう。',q:'次のうち、文法的に間違っているものは？',jp:'',o:['He don’t have to go.','He doesn’t have to go.','He has to go.','He must go.'],a:'He don’t have to go.',e:'He には don’t ではなく doesn’t を使います。'},
{inst:'意味が違う文を1つ選びましょう。',q:'「～しなければならない」を表していない文は？',jp:'',o:['I don’t have to study.','I have to study.','I must study.','She has to study.'],a:'I don’t have to study.',e:'don’t have to は「～する必要はない」なので、義務を表していません。'},
{inst:'意味が違う文を1つ選びましょう。',q:'「～してはいけない」を表す文は？',jp:'',o:['You mustn’t open the door.','You don’t have to open the door.','You have to open the door.','You must open the door.'],a:'You mustn’t open the door.',e:'mustn’t は must not の短縮形で「～してはいけない」です。'},
{inst:'同じ意味になる文を選びましょう。',q:"Don’t touch this box.",jp:'この箱に触ってはいけません。',o:['You must not touch this box.','You don’t have to touch this box.','You have to touch this box.','You must touch this box.'],a:'You must not touch this box.',e:"Don’t ～. と You must not ～. は、どちらも禁止を表します。"},
{inst:'（　）に入る正しい語を選びましょう。',q:'We (　) bring lunch tomorrow. The school gives us lunch.',jp:'私たちは明日、昼食を持ってくる必要はありません。',o:['don’t have to','doesn’t have to','must not','has to'],a:'don’t have to',e:'We なので don’t have to。「必要はない」という意味です。'},
{inst:'（　）に入る正しい語を選びましょう。',q:'My brother (　) go to bed early tonight.',jp:'私の弟は今夜、早く寝なければなりません。',o:['has to','have to','doesn’t have to','must not'],a:'has to',e:'My brother は三人称単数なので has to です。'},
{inst:'意味が正しいものを選びましょう。',q:"You mustn’t talk in the library.",jp:'',o:['図書館で話してはいけません。','図書館で話す必要はありません。','図書館で話さなければなりません。','図書館で話してもよいです。'],a:'図書館で話してはいけません。',e:'mustn’t = must not。「～してはいけない」という禁止です。'},
{inst:'最も適切な文を選びましょう。',q:'It is a school rule. Students (　) wear uniforms.',jp:'それは学校の規則です。生徒は制服を着なければなりません。',o:['have to','has to','don’t have to','must not'],a:'have to',e:'Students は複数形なので have to を使います。'},
{inst:'最後のまとめ問題！正しい組み合わせを選びましょう。',q:'「する必要はない」／「してはいけない」',jp:'',o:["don’t have to ／ must not","must not ／ don’t have to","have to ／ has to","must ／ have to"],a:"don’t have to ／ must not",e:'「～する必要はない」= don’t have to / doesn’t have to。「～してはいけない」= must not / mustn’t / Don’t ～. です。'}
];

let idx=0, selected=null, answered=Array(Q.length).fill(false), correct=Array(Q.length).fill(false), order=[];
const $=id=>document.getElementById(id);
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function buildNums(){ $('nums').innerHTML=''; Q.forEach((_,i)=>{let b=document.createElement('button'); b.className='num'; b.textContent=i+1; b.onclick=()=>{idx=i;render()}; b.id='n'+i; $('nums').appendChild(b)});}
function render(){
  $('quizView').style.display='block'; $('result').classList.remove('show'); selected=null; order=shuffle(Q[idx].o);
  $('meta').textContent=`🌺 第 ${idx+1} 問 / 全30問`;
  $('instruction').textContent=Q[idx].inst; $('question').textContent=Q[idx].q; $('jp').textContent=Q[idx].jp;
  $('options').innerHTML=''; order.forEach(v=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>selectOpt(b,v);$('options').appendChild(b)});
  $('feedback').className='feedback'; $('feedback').innerHTML=''; $('checkBtn').disabled=false; $('nextBtn').disabled=true;
  $('bar').style.width=((idx)/Q.length*100)+'%'; updateNums();
}
function selectOpt(btn,v){if(answered[idx] && $('feedback').classList.contains('show')) return; selected=v; document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');}
function check(){
  if(selected===null){alert('答えを1つ選んでください。');return;}
  answered[idx]=true; correct[idx]=selected===Q[idx].a;
  document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===Q[idx].a)b.classList.add('correct'); if(b.textContent===selected && selected!==Q[idx].a)b.classList.add('incorrect'); b.disabled=true;});
  let ok=correct[idx]; $('feedback').className='feedback show '+(ok?'ok':'ng');
  $('feedback').innerHTML=`<div class="big">${ok?'🌺 正解！ いいね！':'🌊 おしい！ 解説を確認しよう。'}</div><div style='margin-top:10px'><b>✅ 正解：</b> ${Q[idx].a}</div><div style='margin-top:10px;padding:12px 14px;border-radius:14px;background:#ffffff;border-left:6px solid #13a8d8'><b>💡 この問題の解説</b><br>${Q[idx].e}</div><div style='margin-top:8px;font-size:.95em'>※ 解説を読んでから「次の問題へ」を押しましょう。</div>`;
  $('checkBtn').disabled=true; $('nextBtn').disabled=false; $('bar').style.width=((idx+1)/Q.length*100)+'%'; updateNums();
}
function next(){if(idx<Q.length-1){idx++;render()}else{showResult()}}
function updateNums(){Q.forEach((_,i)=>{let b=$('n'+i);b.className='num';if(i===idx)b.classList.add('current');if(answered[i])b.classList.add(correct[i]?'done':'wrong')})}
function resetChoice(){selected=null;document.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'))}
function showResult(){
  $('quizView').style.display='none'; $('result').classList.add('show'); let s=correct.filter(Boolean).length; $('score').textContent=`${s} / 30 点`;
  let m=s>=27?'🌺 すばらしい！基礎はかなり定着しています！':s>=22?'🏝️ いい調子！間違えた問題をもう一度確認しよう！':s>=15?'🌴 あと少し！解説を読みながら復習しよう！':'🦁 ここから伸びます！まずは have/has と「不要・禁止」の違いを復習しよう！';
  $('message').innerHTML=`<span class="badge">基礎レベル</span><p style="font-size:20px;font-weight:900">${m}</p><p class="small">緑にならなかった問題番号を押して復習できます。</p>`;
}
$('checkBtn').onclick=check; $('nextBtn').onclick=next; $('resetBtn').onclick=resetChoice; $('retry').onclick=()=>{idx=0;answered.fill(false);correct.fill(false);render()};
buildNums();render();
</script>
</body>
</html>
