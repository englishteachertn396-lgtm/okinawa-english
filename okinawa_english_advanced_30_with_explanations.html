<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>沖縄で学ぶ！英語ミッション 発展30問</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:"Yu Gothic","Meiryo",sans-serif;background:linear-gradient(#8ee5f3 0 24%,#e7fbff 24% 100%);color:#18364a}
header{background:linear-gradient(90deg,#087f9c,#16b9c6);color:white;padding:18px;text-align:center;border-bottom:7px solid #ffd65a}
header h1{margin:0;font-size:clamp(25px,4vw,42px)} header p{margin:6px 0 0;font-weight:bold}
.wrap{max-width:1080px;margin:auto;padding:18px;display:grid;grid-template-columns:220px 1fr;gap:18px}
.side,.card{background:#fff;border-radius:24px;box-shadow:0 8px 20px #16758a33;border:3px solid #7bdbe4}
.side{padding:15px;height:max-content} .side h3{text-align:center;color:#087f9c;margin:2px 0 10px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px} .num{border:0;border-radius:50%;aspect-ratio:1;background:#e5f8fa;font-weight:bold;cursor:pointer}
.num.current{background:#ffd65a} .num.ok{background:#b9efc4} .num.ng{background:#ffc2c2}
.card{padding:25px;position:relative;overflow:hidden} .card:before{content:"🌺";position:absolute;right:20px;top:12px;font-size:42px}
.badge{display:inline-block;background:#ff8c61;color:#fff;border-radius:999px;padding:7px 15px;font-weight:bold}
h2{font-size:clamp(20px,3vw,30px);padding-right:45px} .choices{display:grid;gap:11px;margin:18px 0}
.choice{text-align:left;padding:13px 16px;border:2px solid #8bdbe4;border-radius:15px;background:white;font-size:17px;cursor:pointer}
.choice:hover{background:#effcfd} .choice.selected{outline:4px solid #ffd65a} .choice.correct{background:#dff7e4;border-color:#38a35b} .choice.wrong{background:#ffe3e3;border-color:#db5b5b}
.words{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0} .word{padding:10px 13px;border:2px solid #62cbd8;background:#fff;border-radius:12px;cursor:pointer}
.answerbox{min-height:48px;padding:11px;border:2px dashed #0aa0b1;border-radius:13px;background:#f2fdff;margin:10px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap} button.main{border:0;border-radius:14px;padding:12px 20px;font-weight:bold;font-size:16px;cursor:pointer;background:#087f9c;color:white}
button.next{background:#ff8c61} .feedback{display:none;margin-top:18px;padding:15px;border-radius:16px;background:#fff7d7;border-left:7px solid #ffd04d;line-height:1.75}
.feedback strong{font-size:18px} .score{margin-top:15px;text-align:center;font-weight:bold} .island{text-align:center;font-size:25px;margin-top:10px}
footer{text-align:center;padding:16px;color:#087f9c;font-weight:bold}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.side{order:2}}
</style>
</head>
<body>
<header><h1>🌺 沖縄で学ぶ！英語ミッション 🏝️</h1><p>🔥 発展レベル 30問｜have to・must・禁止と「必要なし」を使いこなそう！</p></header>
<div class="wrap">
<aside class="side"><h3>MISSION MAP</h3><div id="nums" class="nums"></div><div class="score" id="score">正解 0 / 30</div><div class="island">🌴🌺🦁🌊</div></aside>
<main class="card"><span class="badge" id="badge">QUESTION 1</span><h2 id="q"></h2><div id="area"></div>
<div class="actions"><button class="main" id="check">答え合わせ</button><button class="main next" id="next">次の問題 →</button><button class="main" id="retry" style="display:none">もう一度挑戦</button></div>
<div class="feedback" id="fb"></div></main>
</div><footer>🌊 Chibariyo! じっくり考えて、英語マスターをめざそう！ 🌺</footer>
<script>
const Q=[{"type": "choice", "q": "「私は今日、早く家を出なければなりません。」に最も近い英文は？", "opts": ["I must leave home early today.", "I must not leave home early today.", "I don't have to leave home early today.", "I has to leave home early today."], "ans": 0, "exp": "「～しなければならない」は must または have to で表せます。主語が I なので have to も使えます。ここでは must が正解です。"}, {"type": "choice", "q": "Aya (　) practice the piano today because she has a lesson tomorrow.", "opts": ["has to", "have to", "doesn't have to", "must not"], "ans": 0, "exp": "主語 Aya は三人称単数なので「～しなければならない」は has to。have to ではありません。"}, {"type": "choice", "q": "Tomorrow is Sunday. We (　) go to school.", "opts": ["don't have to", "must not", "has to", "must"], "ans": 0, "exp": "日曜日で「学校へ行く必要がない」という文脈なので don't have to。「行ってはいけない」という禁止ではありません。"}, {"type": "choice", "q": "You (　) use your phone during the test. It is against the rules.", "opts": ["must not", "don't have to", "have to", "has to"], "ans": 0, "exp": "規則で禁止されているので must not（mustn't）＝「～してはいけない」が正解です。don't have to は「する必要がない」です。"}, {"type": "choice", "q": "「Ken has to clean his room.」とほぼ同じ意味の文は？", "opts": ["Ken must clean his room.", "Ken must not clean his room.", "Ken doesn't have to clean his room.", "Don't clean your room, Ken."], "ans": 0, "exp": "肯定文では has to と must はどちらも「～しなければならない」。したがって Ken must clean his room. に書き換えられます。"}, {"type": "choice", "q": "「You must not run here.」とほぼ同じ意味の文は？", "opts": ["Don't run here.", "You don't have to run here.", "You have to run here.", "Please run here."], "ans": 0, "exp": "You must not ～. は「～してはいけません」。命令文の Don't ～.「～してはいけません」とほぼ同じ意味です。"}, {"type": "choice", "q": "次のうち「宿題をする必要はありません」という意味になる文は？", "opts": ["You don't have to do your homework.", "You mustn't do your homework.", "Don't do your homework.", "You have to do your homework."], "ans": 0, "exp": "don't have to ～ は「～する必要はない」。mustn't と Don't は「～してはいけない」なので意味が大きく違います。"}, {"type": "choice", "q": "Mika is sick, so she (　) stay home today.", "opts": ["has to", "have to", "doesn't have to", "must not"], "ans": 0, "exp": "Mika は三人称単数で、病気なので「家にいなければならない」。したがって has to stay が自然です。"}, {"type": "choice", "q": "We have no class this afternoon, so we (　) stay at school.", "opts": ["don't have to", "must not", "has to", "must"], "ans": 0, "exp": "授業がないため「学校に残る必要はない」という意味。主語 We なので don't have to を使います。"}, {"type": "choice", "q": "This sign says, “No swimming.” Which sentence has the same meaning?", "opts": ["You must not swim here.", "You don't have to swim here.", "You have to swim here.", "You must swim here."], "ans": 0, "exp": "No swimming. は「泳いではいけない」という禁止。You must not swim here. が同じ意味です。"}, {"type": "order", "q": "「私たちは明日、制服を着なければなりません。」になるように並べ替えよう。", "words": ["wear", "We", "our uniforms", "tomorrow", "have to"], "answer": "We have to wear our uniforms tomorrow.", "exp": "have to の語順は「主語 + have to + 動詞の原形」。We have to wear ... となります。"}, {"type": "order", "q": "「彼は今日は早く起きる必要はありません。」になるように並べ替えよう。", "words": ["get up", "He", "today", "doesn't have to", "early"], "answer": "He doesn't have to get up early today.", "exp": "主語 He の「～する必要はない」は doesn't have to + 動詞の原形。doesn't の後なので has ではなく have です。"}, {"type": "order", "q": "「ここで写真を撮ってはいけません。」になるように並べ替えよう。", "words": ["take", "must not", "You", "pictures", "here"], "answer": "You must not take pictures here.", "exp": "must not + 動詞の原形で「～してはいけない」。must not take の順番を固めましょう。"}, {"type": "choice", "q": "Which is NOT correct?", "opts": ["He must study tonight.", "He has to study tonight.", "He musts study tonight.", "He doesn't have to study tonight."], "ans": 2, "exp": "must は主語が he でも形が変わりません。musts とは言いません。must + 動詞の原形です。"}, {"type": "choice", "q": "Which is NOT correct?", "opts": ["She doesn't have to cook today.", "She doesn't has to cook today.", "She must cook today.", "She has to cook today."], "ans": 1, "exp": "doesn't の後は動詞の原形なので has ではなく have。正しくは She doesn't have to cook today. です。"}, {"type": "choice", "q": "A: Do I have to bring my lunch?  B: No. School lunch is provided. → Bの内容に合う文は？", "opts": ["You don't have to bring your lunch.", "You must not bring your lunch.", "You must bring your lunch.", "Don't eat lunch."], "ans": 0, "exp": "給食が出るので「弁当を持ってくる必要はない」。禁止ではないため don't have to が正解です。"}, {"type": "choice", "q": "A: Can I enter this room?  B: No. Students are not allowed inside. → 最も適切なのは？", "opts": ["You must not enter this room.", "You don't have to enter this room.", "You have to enter this room.", "You must enter this room."], "ans": 0, "exp": "入室が許可されていない＝禁止なので must not enter。「入る必要がない」ではありません。"}, {"type": "choice", "q": "「Emi must finish this work today.」を have to を使って書き換えると？", "opts": ["Emi has to finish this work today.", "Emi have to finish this work today.", "Emi doesn't have to finish this work today.", "Emi has finish this work today."], "ans": 0, "exp": "Emi は三人称単数なので have to は has to に変わります。must 自体は主語によって変化しません。"}, {"type": "choice", "q": "「We have to be quiet in the library.」を must を使って書き換えると？", "opts": ["We must be quiet in the library.", "We must to be quiet in the library.", "We mustn't be quiet in the library.", "We don't must be quiet in the library."], "ans": 0, "exp": "have to を must にすると must + 動詞の原形。must の後に to は付けません。"}, {"type": "choice", "q": "「Don't touch this button.」を must を使って書き換えると？", "opts": ["You must not touch this button.", "You don't have to touch this button.", "You must touch this button.", "You not must touch this button."], "ans": 0, "exp": "Don't + 動詞の原形は「～するな」という禁止。You must not + 動詞の原形に書き換えられます。"}, {"type": "choice", "q": "次の会話で最も自然なものは？ A: It's a holiday tomorrow. B: Great! I (　) get up at six.", "opts": ["don't have to", "must not", "has to", "must"], "ans": 0, "exp": "休日なので「6時に起きる必要がない」が自然。I don't have to get up ... となります。"}, {"type": "choice", "q": "次の会話で最も自然なものは？ A: The museum says “No food or drinks.” B: OK. We (　) eat here.", "opts": ["must not", "don't have to", "have to", "has to"], "ans": 0, "exp": "No food or drinks は禁止。We must not eat here.「ここで食べてはいけない」が適切です。"}, {"type": "choice", "q": "Riku's mother says, “Your room is already clean.” Which is best?", "opts": ["Riku doesn't have to clean his room.", "Riku mustn't clean his room.", "Riku has to clean his room.", "Don't clean any room."], "ans": 0, "exp": "すでにきれいなので「掃除する必要がない」。doesn't have to が適切で、mustn't にすると「掃除してはいけない」になります。"}, {"type": "choice", "q": "School rule: “Wear your ID card at all times.” Which is best?", "opts": ["Students have to wear their ID cards.", "Students don't have to wear their ID cards.", "Students must not wear their ID cards.", "Don't wear your ID card."], "ans": 0, "exp": "校則で常に着用する必要があるので have to。Students は複数なので has to ではなく have to です。"}, {"type": "choice", "q": "「You don't have to come early.」について正しい説明は？", "opts": ["早く来てもよいが、その必要はない。", "早く来ることは禁止されている。", "必ず早く来なければならない。", "早く帰らなければならない。"], "ans": 0, "exp": "don't have to は「必要がない」。行動そのものを禁止しているわけではないので、早く来ても構いません。"}, {"type": "choice", "q": "「You mustn't come in.」について正しい説明は？", "opts": ["中に入ってはいけない。", "中に入る必要はない。", "中に入らなければならない。", "中に入っても入らなくてもよい。"], "ans": 0, "exp": "mustn't (= must not) は強い禁止。「～する必要はない」という意味ではありません。"}, {"type": "choice", "q": "Which pair has almost the same meaning?", "opts": ["You must not talk. / Don't talk.", "You must not talk. / You don't have to talk.", "You have to talk. / Don't talk.", "You don't have to talk. / You must talk."], "ans": 0, "exp": "You must not talk. と Don't talk. はどちらも「話してはいけない」。禁止を表す同義表現です。"}, {"type": "choice", "q": "Which pair has almost the same meaning?", "opts": ["Mai has to study. / Mai must study.", "Mai doesn't have to study. / Mai mustn't study.", "Mai must study. / Don't study.", "Mai has to study. / Mai must not study."], "ans": 0, "exp": "肯定文の has to と must はどちらも「～しなければならない」で、ほぼ同じ意味です。"}, {"type": "choice", "q": "先生が「明日の宿題はありません」と言いました。最も適切な英文は？", "opts": ["We don't have to do homework tonight.", "We mustn't do homework tonight.", "We have to do homework tonight.", "We must do homework tonight."], "ans": 0, "exp": "宿題がない＝「する必要がない」ので don't have to。mustn't だと「宿題をしてはいけない」になってしまいます。"}, {"type": "choice", "q": "【総合】Which sentence is grammatically and contextually correct? “The red light means stop, so drivers (　) go.”", "opts": ["must not", "don't have to", "has to", "must to"], "ans": 0, "exp": "赤信号では進んではいけないので must not go。文法的にも must の後は動詞の原形 go を置きます。"}];
let idx=0, states=Array(Q.length).fill(null), selected=null, order=[];
const qel=document.getElementById('q'),area=document.getElementById('area'),fb=document.getElementById('fb');
function shuffledOpts(q){ return q.opts.map((v,i)=>({v,i})).sort(()=>Math.random()-.5); }
let optionOrders=Q.map(q=>q.type==='choice'?shuffledOpts(q):null);
function renderNums(){let n=document.getElementById('nums');n.innerHTML='';Q.forEach((_,i)=>{let b=document.createElement('button');b.className='num '+(i===idx?'current ':'')+(states[i]===true?'ok':states[i]===false?'ng':'');b.textContent=i+1;b.onclick=()=>{idx=i;render()};n.appendChild(b)});document.getElementById('score').textContent='正解 '+states.filter(x=>x===true).length+' / 30';}
function render(){selected=null;order=[];fb.style.display='none';document.getElementById('badge').textContent='QUESTION '+(idx+1);qel.textContent=Q[idx].q;area.innerHTML='';let q=Q[idx];
if(q.type==='choice'){let d=document.createElement('div');d.className='choices';optionOrders[idx].forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o.v;b.dataset.i=o.i;b.onclick=()=>{if(fb.style.display==='block')return;selected=o.i;[...d.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};d.appendChild(b)});area.appendChild(d)}
else{let ans=document.createElement('div');ans.className='answerbox';ans.textContent='単語をタップして英文を作ろう';area.appendChild(ans);let w=document.createElement('div');w.className='words';q.words.slice().sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement('button');b.className='word';b.textContent=x;b.onclick=()=>{if(fb.style.display==='block')return;order.push(x);b.disabled=true;ans.textContent=order.join(' ')};w.appendChild(b)});area.appendChild(w);let reset=document.createElement('button');reset.className='word';reset.textContent='↺ 並べ直す';reset.onclick=()=>render();area.appendChild(reset)} renderNums();}
document.getElementById('check').onclick=()=>{let q=Q[idx],ok=false,correct='';
if(q.type==='choice'){if(selected===null){alert('答えを選んでください。');return}ok=selected===q.ans;correct=q.opts[q.ans];[...area.querySelectorAll('.choice')].forEach(b=>{if(+b.dataset.i===q.ans)b.classList.add('correct');if(+b.dataset.i===selected&&selected!==q.ans)b.classList.add('wrong')})}
else{if(!order.length){alert('単語を並べてください。');return}let made=order.join(' ')+ (order.join(' ').endsWith('.')?'':'.');ok=made.toLowerCase()===q.answer.toLowerCase();correct=q.answer;}
states[idx]=ok;fb.innerHTML='<strong>'+(ok?'⭕ 正解！':'❌ おしい！')+'</strong><br><b>正解：</b>'+correct+'<hr><b>💡 この問題の解説</b><br>'+q.exp;fb.style.display='block';renderNums();
if(states.every(x=>x!==null))document.getElementById('retry').style.display='inline-block';};
document.getElementById('next').onclick=()=>{idx=(idx+1)%Q.length;render()};
document.getElementById('retry').onclick=()=>{states=Array(Q.length).fill(null);optionOrders=Q.map(q=>q.type==='choice'?shuffledOpts(q):null);idx=0;render();document.getElementById('retry').style.display='none'};
render();
</script></body></html>
